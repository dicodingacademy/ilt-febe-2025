<!DOCTYPE html>
<html lang="id">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calm Playlist</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/images/favicon/site.webmanifest" />

    <!-- Own Styles -->
    <link rel="stylesheet" href="assets/styles/style.css" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Own Scripts -->
    <script type="module" src="assets/scripts/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Lewati ke konten utama</a>

    <header class="site-header">
      <div class="container header-content">
        <div class="brand">
          <a href="/" aria-label="Calm Playlist, kembali ke beranda">
            <img src="assets/images/calm-logo.png" alt="" />
          </a>
        </div>

        <nav aria-label="Navigasi utama">
          <ul id="navList" class="navlist">
            <li><a href="#blog">Blog</a></li>
            <li><a href="#playlist">Calm Playlist</a></li>
            <li><a href="#join">Join Calm</a></li>
          </ul>
        </nav>

        <button
          id="drawerButton"
          class="drawer-button"
          type="button"
          aria-label="Buka menu navigasi"
          aria-controls="navList"
          aria-expanded="false"
        >
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <main id="mainContent">
      <div class="container">
        <section class="intro">
          <div>
            <h1>Calm Playlist</h1>
            <p>Musik latar untuk fokus dan produktif.</p>
          </div>

          <img
            class="intro__image"
            src="assets/images/headphone.png"
            alt=""
            width="500"
            height="500"
          />
        </section>

        <section class="toolbar" aria-labelledby="filterHeading">
          <h2 id="filterHeading" class="visually-hidden">Filter lagu berdasarkan artist</h2>

          <div id="filterBar" class="filter-bar" role="group" aria-labelledby="filterHeading"></div>
          <p id="resultInfo" class="result-info" role="status"></p>
        </section>

        <section aria-labelledby="listHeading">
          <h2 id="listHeading" class="visually-hidden">Daftar lagu</h2>

          <!-- Kosong dengan sengaja. Isinya dibuat oleh JavaScript. -->
          <div id="musicList" class="music-list"></div>
          <p id="emptyState" class="empty-state" hidden>Tidak ada lagu untuk artist ini.</p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; Copyright 2026</p>
      </div>
    </footer>

    <!-- Ada di HTML sejak awal, disembunyikan dengan atribut [hidden]. -->
    <aside
      id="nowPlaying"
      class="now-playing"
      hidden
      aria-label="Sedang diputar"
      aria-live="polite"
    >
      <div class="container now-playing__content">
        <img id="nowPlayingArt" class="now-playing__art" src="" alt="" />
        <div class="now-playing__meta">
          <span id="nowPlayingLabel" class="now-playing__label">Sedang diputar</span>
          <strong id="nowPlayingTitle" class="now-playing__title"></strong>
          <span id="nowPlayingAuthor" class="now-playing__author"></span>
        </div>

        <button id="nowPlayingToggle" class="now-playing__toggle" type="button">
          <span id="nowPlayingIcon" aria-hidden="true">⏸</span>
          <span id="nowPlayingToggleText">Jeda</span>
        </button>
      </div>
    </aside>

    <!--
      See: <template>: The Content Template element
      https://developer.mozilla.org/en-US/docs/Web/HTML/Element/template
    -->
    <template id="musicItemTemplate">
      <!--
        Isi template disalin 10 kali, jadi memakai class, bukan id.
        Id harus unik dalam satu halaman.
      -->
      <article class="music-item" data-musicid="AUDIO_ID">
        <!-- alt kosong: gambar dekoratif, judulnya sudah ada sebagai teks -->
        <img class="music-item__art" src="" alt="" />
        <div class="music-item__body">
          <h3 class="music-item__title">AUDIO TITLE</h3>
          <p class="music-item__author">AUDIO AUTHOR</p>
          <audio class="music-item__audio" controls preload="none" src=""></audio>
          <p class="music-item__signature"></p>
        </div>
      </article>
    </template>
  </body>
</html>
